{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<form method="POST">
  <h3 align="center">Sign Up</h3>
  <div class="form-group"><label>Email</label>
    <input type="email" class="form-control" name="email" required></div>
  <div class="form-group"><label>First Name</label>
    <input type="text" class="form-control" name="firstName" required></div>
  <div class="form-group"><label>Password</label>
    <input type="password" class="form-control" name="password1" required></div>
  <div class="form-group"><label>Password (Confirm)</label>
    <input type="password" class="form-control" name="password2" required></div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
