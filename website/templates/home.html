{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1 class="text-center">Hi {{ user.first_name }}, your notes</h1>
<div class="form-group">
  <textarea id="note" class="form-control" rows="3" placeholder="Write a note..."></textarea>
  <div id="note-error" class="text-danger small mt-1"></div>
  <button id="save-note" class="btn btn-primary mt-2">Save Note</button>
</div>
<ul class="list-group list-group-flush" id="notes"></ul>
{% endblock %}
